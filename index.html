<script>
// Version of this page: ONE number, MAJOR.MINOR.PATCH (the pill shows it, the update check compares it with version.json). PATCH counts the commits since the last push, MINOR counts the pushes to the live site since the last major (a push: 19.0.4 -> 19.1.0), MAJOR is raised only when the owner says so (19.3.2 -> 20.0.0). Every commit: raise it and write the same value into version.json ({"version":"MAJOR.MINOR.PATCH"}).
const APP_VERSION='19.0.28';
// 1-on-1 help (paid service, the menu button 1-on-1 help; the button is hidden since 12.3: delete the word hidden in <button class="nvb hlp" hidden ...> to show it): the hourly rate and the booking link are set here. HELP_URL empty = no Book button, the window says that booking opens soon.
const HELP_RATE='\u20ac25 / hour',HELP_URL='';
(function(){
  const setBadge=(t,tip,st)=>{const b=document.getElementById('appver');if(b){b.textContent=t;b.title=tip||'';b.dataset.s=st||'ok'}};
  const me='v'+APP_VERSION;
  setBadge(me,'Version '+APP_VERSION,'unk');
  // Stale-page check: the live site publishes version.json. If it names a NEWER version than this page, the page is reloaded - once per live version, so a browser that keeps serving the old copy cannot loop. A page that is newer than the live site (a test copy) never reloads.

function parseKrappy(txt){      // the short text -> the same object the first (JSON) version read
  const m=txt.search(/Krappy Calculator/i);if(m<0)return null;
  const ids={};Object.keys(BLANK.vals).forEach(id=>{ids[xkey(id)]=id});
  const r={vals:{},chk:{},got:0},tok=txt.slice(m).replace(/^Krappy Calculator\s*v?\S*/i,'').match(/\S+/g)||[];
  for(const tk of tok){
    const i=tk.indexOf('=');if(i<1)continue;const k=tk.slice(0,i),w=tk.slice(i+1);let ok=true;
    if(k=='n')r.name=w.replace(/_/g,' ');
    else if(k=='T'){const on=new Set();for(const g of w.matchAll(/([ESGM])(\d+)/g))for(const c of g[2])on.add('s'+g[1]+c);Object.keys(BLANK.chk).forEach(id=>{if(/^s[ESGM]\d$/.test(id))r.chk[id]=on.has(id)})}
    else if(k=='x')r.X=/^[0-9a-z]+$/.test(w)?(w.match(/.{3}/g)||[]).map(c=>xmap()[c]).filter(Boolean):w.split(',').filter(Boolean).map(q=>q.replace(/_/g,' '));      // codes (lower case and digits only) or, as before, names
    else if(k=='at')r.atk=w=='p'?'players':'epics';
    else if(k=='mo')r.mode=w;
    else if(k=='en')r.enemy=w;
    else if(k=='lp')r.lp=w;
    else if(k=='le'){const q=w.split(':');r.le={mode:q[0],enemy:q[1]}}
    else if(Object.prototype.hasOwnProperty.call(ids,k))r.vals[ids[k]]=w;
    else if(Object.prototype.hasOwnProperty.call(BLANK.chk,k))r.chk[k]=w=='1';
    else ok=false;
    if(ok)r.got++;
  }
  return r;
}
function importText(txt){
  let r=parseKrappy(txt);
  if(!r){      // the first version: JSON between the first { and the last }
    const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)return{ok:false,msg:'No inputs found in the text.'};
    try{r=JSON.parse(txt.slice(a,b+1))}catch(e){return{ok:false,msg:'The text is incomplete or was changed: paste the whole exported text.'}}
    if(!r||typeof r!='object'||!r.vals||typeof r.vals!='object')return{ok:false,msg:'No inputs found in the text.'};
    r.got=Object.keys(r.vals).length;
  }
  if(!r.got)return{ok:false,msg:'No inputs found in the text.'};
  const d=clone(BLANK),list=x=>x.filter(q=>typeof q=='string'&&q.length<=40).slice(0,300),own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  let n=0;
  for(const [id,val] of Object.entries(r.vals)){      // only the boxes this page has; a box the text lacks keeps the blank value (0)
    const el=$(id);if(!el||!own(BLANK.vals,id)||MODE_IDS.includes(id)||!(typeof val=='string'||typeof val=='number'))continue;
    let x=String(val).slice(0,30);
    if(el.matches(NUMBOX))x=fmtInt(x)||'0';
    else if(id=='temple')x=tempNorm(x);
    else if(el.tagName=='SELECT'&&![...el.options].some(o=>o.value===x))continue;
    d.vals[id]=x;n++;
  }
  if(r.chk&&typeof r.chk=='object')for(const [id,c] of Object.entries(r.chk))if(own(BLANK.chk,id)&&typeof c=='boolean')d.chk[id]=c;
  d.O=[];for(const c of 'ESGM')for(let i=1;i<=9;i++)if(d.chk['s'+c+i])d.O.push(c+i);      // the kill order of the ticked tiers (the same as sync() builds it)
  if(Array.isArray(r.X))d.X=list(r.X);d.S=[];
  d.atk=r.atk=='players'?'players':'epics';
  d.mode=XMODES.includes(r.mode)?r.mode:'max';d.enemy=XENEMY.includes(String(r.enemy))?String(r.enemy):'4';
  d.le=r.le&&typeof r.le=='object'&&XMODES.includes(r.le.mode)&&XENEMY.includes(String(r.le.enemy))?{mode:r.le.mode,enemy:String(r.le.enemy)}:{mode:'max',enemy:'4'};
  d.lp=['cp','cpd','pvpmax','ren'].includes(r.lp)?r.lp:'cp';
  let nm=typeof r.name=='string'&&r.name.trim()?r.name.trim().slice(0,24):'Imported';const base=nm;let k=2;
  while(tabs.some(t=>t.name===nm))nm=base.slice(0,20)+' '+k++;
  save();tabs.push({name:nm,data:d});active=tabs.length-1;delPending=false;load(d);drawTabs();refresh();
  return{ok:true,msg:'Read '+n+(n==1?' box':' boxes')+' - opened as the new tab “'+nm+'”.'};
}

const fmt=x=>x>=1e12?(x/1e12).toFixed(2)+' T':x>=1e9?(x/1e9).toFixed(2)+' B':x>=1e6?(x/1e6).toFixed(2)+' M':Math.round(x).toLocaleString();
// ---- settings, read once per calculation ----
function getP(){
  if($('mode').value=='maxl')$('mode').value='max';   // the near-maximum modes were removed (old saved tabs)
  const p={d:0,kill:$('mode').value=='kill',ren:$('mode').value=='ren',capA:v('capA'),capM:v('capM'),capU:v('capU'),enemy:$('mode').value=='kill'?3:$('mode').value=='ren'?8:$('mode').value=='max'&&[3,6,8].includes(+$('enemy').value)?+$('enemy').value:4,cat:DEFCAT.slice()};
  ['G','S','M','E','Epic','Players','Giant','Elemental','Dragon','Beast','Melee','Mounted','Ranged','Flying'].forEach(k=>{p['h'+k]=$('bh_'+k)?v('bh_'+k):0;p['s'+k]=$('bs_'+k)?v('bs_'+k):0});
  ['Giant','Elemental','Dragon','Beast'].forEach(k=>{p['dh'+k]=$('dh_'+k)?snapDH($('dh_'+k).value):0});
  p.pm=$('mode').value=='pvpmax';                // PvP Max damage: a fully equipped enemy (4 stacks, every kind of troop), all bonuses and the Double strike count, no Epic strength
  p.cpd=$('mode').value=='cpd'||p.pm;            // CP death: the order that gives the most damage (PvP Max damage uses the same rules)
  p.one=$('mode').value=='cp'||$('mode').value=='cpd';   // CP kill and CP death (PvP): ONE flying enemy stack - only the bonus against flying counts, the Double strike is unused
  p.cp=p.one||p.pm;                              // the PvP engine of the CP modes: tight stacks by health only, groups of equals
  p.pvp=p.cp||p.ren;                             // PvP rules (CP kill, CP death, Max damage and, since 14.9, Renegades): no Epic strength, no bonus against epic enemies, the Against players bonuses count, Specialists deal double damage before the squad bonus (damage, never strength)
  if(p.one)p.enemy=1;

    if((r.ver|0)<3&&tabs.length==1&&tabs[0].name==='Main'){const base=tabs[0].data;tabs=START_TABS.map(n=>({name:n,data:clone(base)}));active=0}}
}catch(e){}
if(!tabs)tabs=START_TABS.map(n=>({name:n,data:clone(BLANK)}));
load(tabs[active].data);
ready=true;
drawTabs();
refresh();
if(FB.key&&aSes())syncNow();      // signed in before: pick up the account's changes (or send this browser's)
</script></main></body></html>
